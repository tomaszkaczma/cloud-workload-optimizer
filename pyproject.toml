[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "poker-hand-ml"
version = "1.0.0"
description = "Leakage-safe comparison of Naive Bayes and Random Forest for multiclass poker-hand classification"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Tomasz Kaczmarski" },
]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
  "classification",
  "imbalanced-data",
  "machine-learning",
  "naive-bayes",
  "random-forest",
]
dependencies = [
  "joblib>=1.3",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "seaborn>=0.13",
]

[project.urls]
Homepage = "https://github.com/tomaszkaczma/Machine-Learning-Coursework"
Issues = "https://github.com/tomaszkaczma/Machine-Learning-Coursework/issues"
Repository = "https://github.com/tomaszkaczma/Machine-Learning-Coursework"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
]
notebook = [
  "jupyterlab>=4.2",
]

[project.scripts]
poker-hand-ml = "poker_hand_ml.experiment:main"
poker-hand-audit = "poker_hand_ml.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
